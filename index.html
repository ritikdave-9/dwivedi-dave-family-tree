<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1628" />
  <title>Dwivedi–Dave Family Tree</title>
  <style>
    :root {
      --bg-deep: #06101f;
      --bg-mid: #0f2544;
      --glass: rgba(22, 58, 105, 0.42);
      --glass-strong: rgba(30, 72, 130, 0.55);
      --glass-border: rgba(140, 190, 255, 0.28);
      --gold: #d4af37;
      --gold-light: #f0d77a;
      --gold-dark: #a67c00;
      --ink: #eef4ff;
      --ink-on-glass: #f8fbff;
      --muted: #9eb8dc;
      --line: rgba(212, 175, 55, 0.75);
      --accent: var(--gold);
      --shadow: 0 10px 36px rgba(0, 12, 40, 0.45);
      --glow-gold: 0 0 22px rgba(212, 175, 55, 0.22);
      --photo-size: clamp(64px, 16vw, 84px);
      --couple-gap: 6px;
      --node-max: 220px;
      --tree-li-pad-x: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(80, 140, 220, 0.35), transparent 55%),
        linear-gradient(165deg, var(--bg-deep) 0%, var(--bg-mid) 45%, #163a62 100%);
      color: var(--ink);
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }

    header h1 {
      margin: 0 0 0.35rem;
      font-weight: 600;
      font-size: clamp(1.35rem, 3vw, 1.85rem);
      letter-spacing: 0.03em;
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 1px 8px rgba(212, 175, 55, 0.35));
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .scroll-hint {
      display: none;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 0 1rem 0.35rem;
    }

    .tree-wrap {
      overflow-x: auto;
      overflow-y: auto;
      max-height: calc(100dvh - 9.25rem);
      padding: 1rem max(1rem, env(safe-area-inset-right)) 3rem
        max(1rem, env(safe-area-inset-left));
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      overscroll-behavior-y: auto;
      touch-action: pan-x pan-y pinch-zoom;
      cursor: grab;
      scroll-behavior: auto;
    }

    .tree-wrap.is-dragging {
      cursor: grabbing;
      scroll-behavior: auto;
      user-select: none;
      -webkit-user-select: none;
    }

    .tree-zoom {
      display: inline-block;
      width: max-content;
      min-width: 100%;
      transform-origin: 0 0;
    }

    .tree {
      display: inline-flex;
      justify-content: center;
      width: max-content;
      min-width: 100%;
      max-width: none;
    }

    .tree ul {
      padding-top: 24px;
      position: relative;
      display: flex;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 0;
      list-style: none;
      margin: 0;
      padding-left: 0;
    }

    .tree li {
      text-align: center;
      list-style-type: none;
      position: relative;
      padding: 24px var(--tree-li-pad-x) 0;
      flex: 0 0 auto;
    }

    .tree li::before,
    .tree li::after {
      content: "";
      position: absolute;
      top: 0;
      right: 50%;
      width: calc(50% + 1px);
      height: 24px;
      border-top: 2px solid var(--line);
    }

    .tree li::after {
      right: auto;
      left: calc(50% - 1px);
      border-left: 2px solid var(--line);
    }

    .tree li:only-child::after,
    .tree li:only-child::before {
      display: none;
    }

    .tree li:only-child {
      padding-top: 0;
    }

    .tree li:first-child::before {
      border: none;
    }

    .tree li:last-child::after {
      border-top: none;
    }

    .tree ul ul::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 0;
      height: 24px;
      border-left: 2px solid var(--line);
    }

    .tree > ul > li {
      padding-top: 0;
    }

    .tree > ul > li::before,
    .tree > ul > li::after {
      display: none;
    }

    .node {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--ink-on-glass);
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(1.25);
      -webkit-backdrop-filter: blur(14px) saturate(1.25);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 12px 14px 10px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      max-width: var(--node-max);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .node:hover {
        transform: translateY(-2px);
        border-color: rgba(212, 175, 55, 0.55);
        box-shadow: var(--shadow), var(--glow-gold), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      }
    }

    .photos {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: var(--couple-gap);
    }

    .photo-frame {
      width: var(--photo-size);
      height: var(--photo-size);
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--gold);
      background: rgba(10, 30, 60, 0.65);
      box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.35);
      flex-shrink: 0;
      position: relative;
    }

    .photo-frame.group {
      width: auto;
      height: auto;
      border-radius: 8px;
      overflow: hidden;
      line-height: 0;
    }

    .photo-frame .photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      transform: scale(1.15);
      transform-origin: center 28%;
    }

    .photo-frame.group .photo {
      width: auto;
      height: auto;
      max-width: 196px;
      max-height: calc(var(--photo-size) * 1.65);
      object-fit: contain;
      object-position: center;
      transform: none;
    }

    .photo-frame.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--muted);
    }

    .label {
      font-size: 0.8rem;
      line-height: 1.35;
      font-weight: 600;
    }

    .label .sub {
      display: block;
      font-weight: 500;
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: 2px;
    }

    .photo-frame:not(.placeholder) {
      cursor: zoom-in;
    }

    #image-hover-preview {
      position: fixed;
      z-index: 2000;
      pointer-events: none;
      padding: 10px;
      background: var(--glass-strong);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 8, 30, 0.55), var(--glow-gold);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.12s ease, visibility 0.12s ease;
      max-width: min(480px, 92vw);
      max-height: min(640px, 88vh);
    }

    #image-hover-preview.is-visible {
      opacity: 1;
      visibility: visible;
    }

    #image-hover-preview img {
      display: block;
      max-width: min(460px, 90vw);
      max-height: min(620px, 86vh);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
    }

    #image-hover-preview .preview-caption {
      margin-top: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      color: var(--gold-light);
    }

    #image-preview-layer {
      position: fixed;
      inset: 0;
      z-index: 2000;
      pointer-events: none;
    }

    #image-preview-layer .preview-backdrop {
      display: none;
    }

    body.preview-open {
      overflow: hidden;
    }

    @media (max-width: 900px) {
      :root {
        --node-max: min(188px, 44vw);
        --tree-li-pad-x: 6px;
        --couple-gap: 4px;
      }

      .tree-wrap {
        max-height: calc(100dvh - 10.5rem);
        min-height: 42vh;
        touch-action: pan-x pan-y pinch-zoom;
        overscroll-behavior-x: contain;
        overscroll-behavior-y: auto;
      }

      .tree ul {
        gap: 0;
        padding-top: 18px;
      }

      .tree li {
        padding-top: 18px;
      }

      .tree li::before,
      .tree li::after {
        height: 18px;
      }

      .tree ul ul::before {
        height: 18px;
      }

      .scroll-hint {
        display: block;
      }

      .legend {
        font-size: 0.72rem;
        padding: 0 0.65rem;
      }

      .photo-frame.group .photo {
        max-width: min(168px, 40vw);
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 1rem 0.65rem 0.65rem;
      }

      .node {
        padding: 8px 8px 6px;
        border-radius: 10px;
      }

      .label .sub {
        font-size: 0.68rem;
      }
    }

    @media (hover: none), (pointer: coarse) {
      #image-preview-layer.is-open {
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(12px, env(safe-area-inset-top))
          max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
      }

      #image-preview-layer.is-open .preview-backdrop {
        display: block;
        position: absolute;
        inset: 0;
        background: rgba(4, 12, 28, 0.72);
      }

      #image-preview-layer.is-open #image-hover-preview {
        position: relative;
        left: auto !important;
        top: auto !important;
        pointer-events: auto;
        max-width: min(480px, 94vw);
        max-height: min(85vh, 720px);
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }

      #image-preview-layer.is-open #image-hover-preview img {
        max-width: 100%;
        max-height: min(72vh, 560px);
      }

      .photo-frame:not(.placeholder) {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      /* Long-press peek: floating preview like desktop hover (not full lightbox). */
      #image-preview-layer.is-touch-hold {
        visibility: visible;
        pointer-events: none;
      }

      #image-preview-layer.is-touch-hold #image-hover-preview {
        position: fixed;
        z-index: 2001;
        pointer-events: none;
        max-width: min(420px, 88vw);
        max-height: min(560px, 70vh);
      }

      #image-preview-layer.is-touch-hold #image-hover-preview img {
        max-width: min(400px, 86vw);
        max-height: min(520px, 65vh);
      }
    }

    body.poster-export {
      min-height: auto;
      overflow: hidden;
    }

    body.poster-export header {
      padding: 0.65rem 0.5rem 0.35rem;
    }

    body.poster-export header h1 {
      font-size: 1.35rem;
    }

    body.poster-export header p {
      font-size: 0.78rem;
    }

    body.poster-export .scroll-hint {
      display: none !important;
    }

    body.poster-export #poster-capture {
      width: 4961px;
      height: 3508px;
      margin: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 36px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(80, 140, 220, 0.35), transparent 55%),
        linear-gradient(165deg, var(--bg-deep) 0%, var(--bg-mid) 45%, #163a62 100%);
    }

    body.poster-export #poster-content {
      transform-origin: top center;
      width: max-content;
      max-width: none;
      flex: 0 0 auto;
    }

    body.poster-export .tree-wrap {
      overflow: visible;
      max-height: none;
      width: max-content;
      max-width: none;
      padding: 0.25rem 0 0;
      cursor: default;
      touch-action: auto;
    }

    body.poster-export .tree-zoom {
      transform: none !important;
      min-width: 0;
      width: max-content;
    }

    body.poster-export .tree {
      width: max-content;
      min-width: 0;
    }

    body.poster-export .tree ul {
      padding-top: calc(var(--photo-size) * 0.22);
    }

    body.poster-export .tree li {
      padding-top: calc(var(--photo-size) * 0.22);
    }

    body.poster-export .tree li::before,
    body.poster-export .tree li::after {
      height: calc(var(--photo-size) * 0.22);
    }

    body.poster-export .tree ul ul::before {
      height: calc(var(--photo-size) * 0.22);
    }

    body.poster-export .node {
      padding: 5px 7px 4px;
      border-radius: 9px;
      gap: 3px;
    }

    body.poster-export .label {
      font-size: 0.58rem;
      line-height: 1.25;
    }

    body.poster-export .label .sub {
      font-size: 0.52rem;
      margin-top: 1px;
    }

    body.poster-export .photo-frame {
      border-width: 2px;
    }

    body.poster-export .photo-frame.placeholder {
      font-size: 1.1rem;
    }

    body.poster-export .photo-frame.group .photo {
      max-width: calc(var(--photo-size) * 2.15);
      max-height: calc(var(--photo-size) * 1.45);
    }

    body.poster-export #image-preview-layer {
      display: none !important;
    }

  </style>
</head>
<body>
  <div id="poster-capture">
    <div id="poster-content">
      <header>
        <h1 id="page-title">Dwivedi–Dave Family Tree</h1>
        <p id="page-subtitle">From Maha Pandit Raghunath Ji</p>
      </header>
      <p class="scroll-hint">Drag to pan · pinch to zoom · double-tap tree to reset zoom · hold a photo to preview.</p>
      <div class="tree-wrap" id="tree-scroll">
        <div class="tree-zoom" id="tree-zoom">
          <div class="tree" id="tree-root"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="image-preview-layer" aria-hidden="true">
    <div class="preview-backdrop" aria-hidden="true"></div>
    <div id="image-hover-preview">
      <img src="" alt="" />
      <div class="preview-caption"></div>
    </div>
  </div>

  <script>
    const POSTER_MODE =
      new URLSearchParams(location.search).get("poster") === "1";

    let treePanDidDrag = false;
    let treeScale = 1;
    const TREE_SCALE_MIN = 0.45;
    const TREE_SCALE_MAX = 3;

    let IMAGE_DIR = "images";
    let IMAGE_FILES = [];
    let EXPLICIT_IMAGE = {};
    let family = null;
    let HONORIFIC_MAX_DEPTH = 3;

    function normalize(s) {
      return (s || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function tokens(s) {
      return normalize(s).split(" ").filter(Boolean);
    }

    function imageUrl(filename) {
      return encodeURI(`${IMAGE_DIR}/${filename}`);
    }

    function basename(file) {
      return normalize(file.replace(/\.(jpe?g|png|webp)$/i, ""));
    }

    function isPairFilename(file) {
      if (/^pair-/i.test(file)) return true;
      if (/^group-/i.test(file)) return true;
      const raw = file.replace(/\.(jpe?g|png|webp)$/i, "");
      if (/\band\b/i.test(raw)) return true;
      if (/,/.test(raw)) return true;
      if (/\s&\s/.test(raw)) return true;
      if (/\s+and\s+/i.test(raw)) return true;
      if (/\(pair\)/i.test(raw)) return true;
      return false;
    }

    function personMatchesFile(personName, file) {
      const base = basename(file);
      const person = normalize(personName);
      const personToks = tokens(personName).filter((t) => t.length >= 3);
      if (base.includes(person)) return true;
      if (person.includes("raghunath") && /raghu/.test(base)) return true;
      if (person.includes("nandini") && /nandani/.test(base)) return true;
      if (person.includes("naisha") && /nayasha/.test(base)) return true;
      if (person.includes("samriddhi") && /samridhi/.test(base)) return true;
      if (person.includes("gunwanth") && /gunvant/.test(base)) return true;
      if (person.includes("shashikala") && /shashi/.test(base)) return true;
      return personToks.some((t) => base.includes(t));
    }

    function fileMatchesAllPeople(file, names) {
      return names.every((n) => personMatchesFile(n, file));
    }

    function scorePairFileForCouple(file, names) {
      const base = basename(file);
      let score = 100;
      const coupleHit = names.every((n) => personMatchesFile(n, file));
      if (!coupleHit) return -1;

      const rosterHints = [
        "nayasha",
        "naisha",
        "aryan",
        "avishi",
        "trisha",
        "bhav",
        "harshita",
        "ritik",
        "piyul",
        "javesh",
      ];
      const coupleParts = names
        .flatMap((n) => tokens(n))
        .filter((t) => t.length >= 4);

      for (const hint of rosterHints) {
        if (!base.includes(hint)) continue;
        const inCouple = coupleParts.some(
          (t) => t.includes(hint) || hint.includes(t)
        );
        if (!inCouple) score -= 35;
      }
      score -= Math.max(0, (file.match(/,/g) || []).length - 1) * 8;
      return score;
    }

    function scoreFileForPerson(file, personName) {
      if (isPairFilename(file)) return 0;

      const base = basename(file);
      const person = normalize(personName);
      const personToks = tokens(personName);
      if (base === person) return 100;
      if (base.includes(person) || person.includes(base)) return 80;
      let hits = 0;
      for (const t of personToks) {
        if (t.length < 3) continue;
        if (base.includes(t)) hits++;
      }
      if (hits >= 2) return 50 + hits * 10;
      if (hits === 1 && personToks.length === 1) return 45;
      if (person.includes("raghunath") && /raghu/.test(base)) return 70;
      if (person.includes("nandini") && /nandani/.test(base)) return 65;
      if (person.includes("naisha") && /nayasha/.test(base)) return 65;
      if (person.includes("samriddhi") && /samridhi/.test(base)) return 65;
      if (person.includes("gunwanth") && /gunvant/.test(base)) return 65;
      if (person.includes("shashikala") && /shashi/.test(base)) return 55;
      return 0;
    }

    const usedFiles = new Set();

    function findPairImage(names) {
      if (names.length < 2) return null;

      let best = null;
      let bestScore = -Infinity;
      for (const file of IMAGE_FILES) {
        if (usedFiles.has(file)) continue;
        if (!isPairFilename(file)) continue;
        if (!fileMatchesAllPeople(file, names)) continue;
        const score = scorePairFileForCouple(file, names);
        if (score > bestScore) {
          bestScore = score;
          best = file;
        }
      }
      if (best && bestScore >= 0) {
        usedFiles.add(best);
        return best;
      }
      return null;
    }

    function findImageForPerson(name) {
      const key = normalize(name);
      const exact = EXPLICIT_IMAGE[key];
      if (exact && !usedFiles.has(exact) && !isPairFilename(exact)) {
        usedFiles.add(exact);
        return { src: exact, group: false };
      }

      let best = null;
      let bestScore = 0;
      for (const file of IMAGE_FILES) {
        if (usedFiles.has(file)) continue;
        if (isPairFilename(file)) continue;
        const s = scoreFileForPerson(file, name);
        if (s > bestScore) {
          bestScore = s;
          best = file;
        }
      }
      if (best && bestScore >= 40) {
        usedFiles.add(best);
        return { src: best, group: false };
      }
      return null;
    }

    function resolvePhotos(node) {
      const people = [node.name];
      if (node.spouse) people.push(node.spouse);

      if (people.length > 1) {
        const pair = findPairImage(people);
        if (pair) {
          return [{ src: pair, group: true, alt: people.join(" & ") }];
        }
      }

      const photos = [];
      for (const p of people) {
        const img = findImageForPerson(p);
        photos.push(
          img
            ? { ...img, alt: p }
            : { placeholder: true, alt: p }
        );
      }
      return photos;
    }

    function isFemaleName(name) {
      const n = normalize(name);
      if (/\bdevi\b/.test(n)) return true;
      return new Set([
        "shashikala",
        "mani devi",
        "nandini",
        "maya devi",
      ]).has(n);
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function withHonorific(name, depth) {
      if (depth > HONORIFIC_MAX_DEPTH) return escapeHtml(name);
      if (/maha\s+pandit/i.test(name)) return escapeHtml(name);
      if (/^shri(mati)?\s/i.test(name.trim())) return escapeHtml(name);
      const prefix = isFemaleName(name) ? "Shrimati " : "Shri ";
      return escapeHtml(prefix + name);
    }

    function displayName(node, depth) {
      let text = withHonorific(node.name, depth);
      if (node.spouse) {
        text +=
          ' <span class="sub">&amp; ' +
          withHonorific(node.spouse, depth) +
          "</span>";
      }
      return text;
    }

    const previewLayer = document.getElementById("image-preview-layer");
    const previewBackdrop = previewLayer.querySelector(".preview-backdrop");
    const hoverPreview = document.getElementById("image-hover-preview");
    const hoverPreviewImg = hoverPreview.querySelector("img");
    const hoverPreviewCaption = hoverPreview.querySelector(".preview-caption");
    let activePreviewFrame = null;

    function usesTouchPreview() {
      return window.matchMedia("(hover: none), (pointer: coarse)").matches;
    }

    function positionHoverPreview(clientX, clientY) {
      const touchHold = previewLayer.classList.contains("is-touch-hold");
      if (usesTouchPreview() && !touchHold) return;
      const pad = 18;
      const rect = hoverPreview.getBoundingClientRect();
      const w = rect.width || 320;
      const h = rect.height || 400;
      let left = clientX + pad;
      let top = clientY + pad;
      if (left + w > window.innerWidth - pad) {
        left = clientX - w - pad;
      }
      if (top + h > window.innerHeight - pad) {
        top = clientY - h - pad;
      }
      left = Math.max(pad, Math.min(left, window.innerWidth - w - pad));
      top = Math.max(pad, Math.min(top, window.innerHeight - h - pad));
      hoverPreview.style.left = `${left}px`;
      hoverPreview.style.top = `${top}px`;
    }

    function showHoverPreview(fullSrc, alt, clientX, clientY) {
      hoverPreviewImg.src = fullSrc;
      hoverPreviewImg.alt = alt;
      hoverPreviewCaption.textContent = alt;
      hoverPreview.classList.add("is-visible");
      previewLayer.classList.add("is-open");
      previewLayer.setAttribute("aria-hidden", "false");

      if (usesTouchPreview()) {
        document.body.classList.add("preview-open");
        hoverPreview.style.left = "";
        hoverPreview.style.top = "";
      } else {
        requestAnimationFrame(() => positionHoverPreview(clientX, clientY));
      }
    }

    function showTouchHoldPreview(fullSrc, alt, clientX, clientY) {
      hoverPreviewImg.src = fullSrc;
      hoverPreviewImg.alt = alt;
      hoverPreviewCaption.textContent = alt;
      hoverPreview.classList.add("is-visible");
      previewLayer.classList.add("is-touch-hold");
      previewLayer.setAttribute("aria-hidden", "false");
      requestAnimationFrame(() => positionHoverPreview(clientX, clientY));
    }

    function hideHoverPreview() {
      hoverPreview.classList.remove("is-visible");
      previewLayer.classList.remove("is-open", "is-touch-hold");
      previewLayer.setAttribute("aria-hidden", "true");
      document.body.classList.remove("preview-open");
      activePreviewFrame = null;
    }

    previewBackdrop.addEventListener("click", hideHoverPreview);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && hoverPreview.classList.contains("is-visible")) {
        hideHoverPreview();
      }
    });

    function touchPairDistance(touches) {
      if (touches.length < 2) return 0;
      const dx = touches[1].clientX - touches[0].clientX;
      const dy = touches[1].clientY - touches[0].clientY;
      return Math.hypot(dx, dy);
    }

    function applyTreeScale() {
      const zoom = document.getElementById("tree-zoom");
      if (!zoom) return;
      const supportsZoom =
        "zoom" in zoom.style ||
        (typeof CSS !== "undefined" && CSS.supports("zoom", "1.1"));
      if (supportsZoom) {
        zoom.style.zoom = String(treeScale);
        zoom.style.transform = "";
      } else {
        zoom.style.zoom = "";
        zoom.style.transform = `scale(${treeScale})`;
        zoom.style.transformOrigin = "0 0";
      }
    }

    function setupTreeGestures() {
      const wrap = document.getElementById("tree-scroll");
      if (!wrap) return;

      let panActive = false;
      let startX = 0;
      let startY = 0;
      let scrollLeft = 0;
      let scrollTop = 0;
      const dragThreshold = 6;

      let pinchActive = false;
      let pinchStartDist = 0;
      let pinchStartScale = 1;

      let lastTapAt = 0;

      const onPointerDown = (e) => {
        if (pinchActive) return;
        if (e.button !== undefined && e.button !== 0) return;
        if (e.target.closest("#image-preview-layer.is-open")) return;
        if (e.target.closest(".photo-frame:not(.placeholder)")) return;
        panActive = true;
        treePanDidDrag = false;
        wrap.classList.add("is-dragging");
        startX = e.clientX;
        startY = e.clientY;
        scrollLeft = wrap.scrollLeft;
        scrollTop = wrap.scrollTop;
        if (wrap.setPointerCapture && e.pointerId !== undefined) {
          try {
            wrap.setPointerCapture(e.pointerId);
          } catch (_) {}
        }
      };

      const onPointerMove = (e) => {
        if (pinchActive || !panActive) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (!treePanDidDrag && Math.hypot(dx, dy) < dragThreshold) return;

        treePanDidDrag = true;
        wrap.scrollLeft = scrollLeft - dx;
        wrap.scrollTop = scrollTop - dy;

      };

      const endPan = (e) => {
        if (!panActive) return;
        panActive = false;
        wrap.classList.remove("is-dragging");
        if (wrap.releasePointerCapture && e.pointerId !== undefined) {
          try {
            wrap.releasePointerCapture(e.pointerId);
          } catch (_) {}
        }
        if (treePanDidDrag) {
          window.setTimeout(() => {
            treePanDidDrag = false;
          }, 120);
        }
      };

      if (!usesTouchPreview()) {
        wrap.addEventListener("pointerdown", onPointerDown);
        wrap.addEventListener("pointermove", onPointerMove);
        wrap.addEventListener("pointerup", endPan);
        wrap.addEventListener("pointercancel", endPan);
        wrap.addEventListener("lostpointercapture", endPan);
      }

      wrap.addEventListener(
        "touchstart",
        (e) => {
          if (e.touches.length === 2) {
            pinchActive = true;
            panActive = false;
            wrap.classList.remove("is-dragging");
            pinchStartDist = touchPairDistance(e.touches);
            pinchStartScale = treeScale;
          }
        },
        { passive: true }
      );

      wrap.addEventListener(
        "touchmove",
        (e) => {
          if (!pinchActive || e.touches.length !== 2) return;
          if (e.cancelable) e.preventDefault();
          const dist = touchPairDistance(e.touches);
          if (pinchStartDist <= 0) return;
          const next = pinchStartScale * (dist / pinchStartDist);
          treeScale = Math.min(
            TREE_SCALE_MAX,
            Math.max(TREE_SCALE_MIN, next)
          );
          applyTreeScale();
        },
        { passive: false }
      );

      wrap.addEventListener(
        "touchend",
        (e) => {
          if (e.touches.length < 2) {
            pinchActive = false;
            pinchStartDist = 0;
          }
          if (e.touches.length > 0) return;
          if (e.target.closest(".photo-frame:not(.placeholder)")) return;
          const now = Date.now();
          if (now - lastTapAt < 360) {
            treeScale = 1;
            applyTreeScale();
            lastTapAt = 0;
          } else {
            lastTapAt = now;
          }
        },
        { passive: true }
      );

      wrap.addEventListener("touchcancel", () => {
        pinchActive = false;
        pinchStartDist = 0;
      });
    }

    function attachPhotoHover(frame, fullSrc, alt) {
      let longPressTimer = null;
      let longPressShowing = false;
      let pressX = 0;
      let pressY = 0;
      const LONG_PRESS_MS = 480;
      const LONG_PRESS_MOVE_CANCEL = 14;

      const clearLongPress = () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      };

      frame.addEventListener("contextmenu", (e) => {
        if (usesTouchPreview()) e.preventDefault();
      });

      frame.addEventListener("pointerdown", (e) => {
        if (!usesTouchPreview()) return;
        if (e.pointerType === "mouse") return;
        e.stopPropagation();
        pressX = e.clientX;
        pressY = e.clientY;
        longPressShowing = false;
        clearLongPress();
        longPressTimer = window.setTimeout(() => {
          longPressShowing = true;
          activePreviewFrame = frame;
          showTouchHoldPreview(fullSrc, alt, pressX, pressY);
          if (navigator.vibrate) navigator.vibrate(12);
        }, LONG_PRESS_MS);
      });

      frame.addEventListener("pointermove", (e) => {
        if (!usesTouchPreview() || e.pointerType === "mouse") return;
        if (longPressShowing) {
          positionHoverPreview(e.clientX, e.clientY);
          e.stopPropagation();
          return;
        }
        const moved = Math.hypot(e.clientX - pressX, e.clientY - pressY);
        if (moved > LONG_PRESS_MOVE_CANCEL) clearLongPress();
      });

      const endLongPress = (e) => {
        if (!usesTouchPreview() || e.pointerType === "mouse") return;
        clearLongPress();
        if (longPressShowing) {
          hideHoverPreview();
          longPressShowing = false;
        }
      };

      frame.addEventListener("pointerup", endLongPress);
      frame.addEventListener("pointercancel", endLongPress);
      frame.addEventListener("lostpointercapture", endLongPress);

      frame.addEventListener("click", (e) => {
        if (!usesTouchPreview()) return;
        e.preventDefault();
        e.stopPropagation();
      });

      frame.addEventListener("mouseenter", (e) => {
        if (usesTouchPreview()) return;
        activePreviewFrame = frame;
        showHoverPreview(fullSrc, alt, e.clientX, e.clientY);
      });
      frame.addEventListener("mousemove", (e) => {
        if (usesTouchPreview()) return;
        if (hoverPreview.classList.contains("is-visible")) {
          positionHoverPreview(e.clientX, e.clientY);
        }
      });
      frame.addEventListener("mouseleave", () => {
        if (usesTouchPreview()) return;
        hideHoverPreview();
      });
    }

    function tunePortraitCrop(img, isGroup) {
      if (isGroup) return;

      const w = img.naturalWidth;
      const h = img.naturalHeight;
      if (!w || !h) return;

      const portrait = h > w * 1.05;
      if (portrait) {
        img.style.objectPosition = "center 18%";
        img.style.transform = "scale(1.12)";
        img.style.transformOrigin = "center 22%";
      } else if (w > h * 1.1) {
        img.style.objectPosition = "center 42%";
        img.style.transform = "scale(1.2)";
        img.style.transformOrigin = "center 40%";
      } else {
        img.style.objectPosition = "center 24%";
        img.style.transform = "scale(1.15)";
      }
    }

    function buildNode(node, depth = 0) {
      const li = document.createElement("li");
      const box = document.createElement("div");
      box.className = "node";

      const photosDiv = document.createElement("div");
      photosDiv.className = "photos";
      const photos = resolvePhotos(node);

      for (const ph of photos) {
        if (ph.placeholder) {
          const frame = document.createElement("div");
          frame.className = "photo-frame placeholder";
          frame.title = ph.alt;
          frame.textContent = "👤";
          frame.setAttribute("aria-label", ph.alt);
          photosDiv.appendChild(frame);
        } else {
          const frame = document.createElement("div");
          frame.className = "photo-frame" + (ph.group ? " group" : "");
          const img = document.createElement("img");
          img.className = "photo";
          img.src = imageUrl(ph.src);
          img.alt = ph.alt;
          img.loading = POSTER_MODE ? "eager" : "lazy";
          img.decoding = POSTER_MODE ? "sync" : "async";
          img.addEventListener("load", () => tunePortraitCrop(img, ph.group));
          frame.appendChild(img);
          if (!POSTER_MODE) {
            attachPhotoHover(frame, imageUrl(ph.src), ph.alt);
          }
          photosDiv.appendChild(frame);
        }
      }

      const label = document.createElement("div");
      label.className = "label";
      label.innerHTML = displayName(node, depth);

      box.appendChild(photosDiv);
      box.appendChild(label);
      li.appendChild(box);

      if (node.children && node.children.length) {
        const ul = document.createElement("ul");
        for (const child of node.children) {
          ul.appendChild(buildNode(child, depth + 1));
        }
        li.appendChild(ul);
      }

      return li;
    }

    function render() {
      if (!family) return;
      usedFiles.clear();
      const root = document.getElementById("tree-root");
      root.replaceChildren();
      const ul = document.createElement("ul");
      ul.appendChild(buildNode(family));
      root.appendChild(ul);
    }

    async function waitForTreeImages() {
      const imgs = [...document.querySelectorAll(".tree img")];
      await Promise.all(
        imgs.map((img) =>
          img.complete
            ? Promise.resolve()
            : new Promise((r) => {
                img.onload = img.onerror = r;
              })
        )
      );
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    }

    async function applyPosterMetrics(photoSize) {
      const content = document.getElementById("poster-content");
      const px = Math.round(photoSize);
      const vars = document.body.style;
      vars.setProperty("--photo-size", `${px}px`);
      vars.setProperty("--node-max", `${Math.round(px * 2.35)}px`);
      vars.setProperty("--couple-gap", `${Math.max(3, Math.round(px / 13))}px`);
      vars.setProperty("--tree-li-pad-x", `${Math.max(1, Math.round(px / 16))}px`);
      if (content) content.style.transform = "none";
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    }

    async function measurePosterContent() {
      const content = document.getElementById("poster-content");
      return {
        w: content?.scrollWidth || 1,
        h: content?.scrollHeight || 1,
      };
    }

    async function layoutPosterForExport() {
      await waitForTreeImages();
      const content = document.getElementById("poster-content");
      const tree = document.querySelector(".tree");
      if (!content || !tree) return;

      const frameW = 4961;
      const frameH = 3508;
      const marginX = 40;
      const marginY = 32;
      const targetFill = 0.97;

      let lo = 48;
      let hi = 280;
      let bestPhoto = lo;
      let bestScale = 1;

      while (lo <= hi) {
        const mid = Math.floor((lo + hi) / 2);
        await applyPosterMetrics(mid);
        const { w, h } = await measurePosterContent();
        const fillScale = Math.min(
          ((frameW - marginX * 2) * targetFill) / w,
          ((frameH - marginY * 2) * targetFill) / h
        );

        if (fillScale >= 1) {
          bestPhoto = mid;
          bestScale = fillScale;
          lo = mid + 1;
        } else {
          hi = mid - 1;
        }
      }

      await applyPosterMetrics(bestPhoto);
      const { w, h } = await measurePosterContent();
      bestScale = Math.min(
        ((frameW - marginX * 2) * targetFill) / w,
        ((frameH - marginY * 2) * targetFill) / h
      );

      content.style.transform = `scale(${bestScale})`;
      document.body.dataset.posterPhotoSize = String(bestPhoto);
      document.documentElement.dataset.posterPhotoSize = String(bestPhoto);
      document.documentElement.dataset.posterScale = String(bestScale);
      document.documentElement.dataset.posterReady = "1";
    }

    async function init() {
      if (POSTER_MODE) {
        document.body.classList.add("poster-export");
      }

      const res = await fetch("family-tree.json");
      if (!res.ok) {
        throw new Error("Could not load family-tree.json");
      }
      const data = await res.json();
      document.getElementById("page-title").textContent = data.meta.title;
      document.getElementById("page-subtitle").textContent = data.meta.subtitle;
      document.title = data.meta.title;
      HONORIFIC_MAX_DEPTH = data.meta.honorificMaxDepth ?? 3;
      IMAGE_DIR = data.images.directory || "images";
      IMAGE_FILES = data.images.files;
      EXPLICIT_IMAGE = data.images.explicit;
      family = data.tree;
      render();

      if (POSTER_MODE) {
        await layoutPosterForExport();
        return;
      }

      setupTreeGestures();
      applyTreeScale();
      const wrap = document.getElementById("tree-scroll");
      if (wrap) {
        const ul = wrap.querySelector(".tree > ul");
        if (ul && ul.scrollWidth > wrap.clientWidth) {
          wrap.scrollLeft = (ul.scrollWidth - wrap.clientWidth) / 2;
        }
      }
    }

    init().catch((err) => {
      console.error(err);
      document.getElementById("tree-root").textContent =
        "Failed to load family-tree.json. Open this page via a local web server (not file://).";
    });
  </script>
</body>
</html>
